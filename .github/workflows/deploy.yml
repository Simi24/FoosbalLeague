name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      api_url: ${{ steps.tf.outputs.api_url }}
      api_url_public: ${{ steps.tf.outputs.api_url_public }}
      cognito_client_id: ${{ steps.tf.outputs.cognito_client_id }}
      frontend_bucket: ${{ steps.tf.outputs.frontend_bucket }}
      cloudfront_dist_id: ${{ steps.tf.outputs.cloudfront_dist_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/foosball-league:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure state lock table
        run: |
          if ! aws dynamodb describe-table --table-name foosball-league-terraform-lock --region eu-west-1 &>/dev/null; then
            aws dynamodb create-table \
              --table-name foosball-league-terraform-lock \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region eu-west-1
            aws dynamodb wait table-exists --table-name foosball-league-terraform-lock --region eu-west-1
          fi

      - name: Terraform init
        working-directory: infra
        run: terraform init -backend-config=envs/${{ inputs.environment }}/backend.hcl

      - name: Reconcile Terraform state
        working-directory: infra
        run: bash scripts/reconcile-state.sh ${{ inputs.environment }} ${{ github.sha }}

      - name: Deploy via Terraform
        id: tf
        working-directory: infra
        env:
          # Cloudflare provider requires a token to initialize, even if no CF resources
          # are created (dev/staging have domain_name=""). Fallback to dummy value so
          # provider config validation passes; no API call is made when count=0.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || 'placeholder-not-used' }}
        run: |
          terraform apply -auto-approve \
            -var-file=envs/${{ inputs.environment }}/terraform.tfvars \
            -var="image_tag=${{ github.sha }}"
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "api_url_public=$(terraform output -raw api_url_public)" >> "$GITHUB_OUTPUT"
          echo "cognito_client_id=$(terraform output -raw cognito_client_id)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_dist_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ needs.deploy-backend.outputs.api_url_public }}
          VITE_COGNITO_REGION: eu-west-1
          VITE_COGNITO_CLIENT_ID: ${{ needs.deploy-backend.outputs.cognito_client_id }}
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Deploy to S3
        run: aws s3 sync frontend/dist/ s3://${{ needs.deploy-backend.outputs.frontend_bucket }}/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ needs.deploy-backend.outputs.cloudfront_dist_id }} --paths "/*"
