name: Deploy App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          target: prod
          platforms: linux/arm64
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/foosball-league:${{ github.sha }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Lambda image
        run: |
          aws lambda update-function-code \
            --function-name foosball-league-${{ inputs.environment }} \
            --image-uri ${{ steps.ecr.outputs.registry }}/foosball-league:${{ github.sha }} \
            --region eu-west-1
          aws lambda wait function-updated \
            --function-name foosball-league-${{ inputs.environment }} \
            --region eu-west-1

      - name: Read deploy targets from Terraform state
        id: targets
        run: |
          STATE=$(aws s3 cp "s3://foosball-league-terraform-state/${{ inputs.environment }}/terraform.tfstate" -)
          {
            echo "api_url_public=$(echo "$STATE" | jq -r '.outputs.api_url_public.value')"
            echo "cognito_client_id=$(echo "$STATE" | jq -r '.outputs.cognito_client_id.value')"
            echo "frontend_bucket=$(echo "$STATE" | jq -r '.outputs.frontend_bucket.value')"
            echo "cloudfront_dist_id=$(echo "$STATE" | jq -r '.outputs.cloudfront_distribution_id.value')"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: ${{ steps.targets.outputs.api_url_public }}
          VITE_COGNITO_REGION: eu-west-1
          VITE_COGNITO_CLIENT_ID: ${{ steps.targets.outputs.cognito_client_id }}
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Deploy to S3
        run: aws s3 sync frontend/dist/ s3://${{ steps.targets.outputs.frontend_bucket }}/ --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ${{ steps.targets.outputs.cloudfront_dist_id }} --paths "/*"
