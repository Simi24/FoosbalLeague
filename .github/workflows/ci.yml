name: CI

on:
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.17.3
      - run: ruff check backend/app/

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt pytest httpx
      # Unit tests only: the integration suite needs LocalStack (just test-integration).
      - run: cd backend && PYTHONPATH=app ENV=local LOCAL=true python -m pytest app/tests -v --ignore=app/tests/integration

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && yarn lint

  frontend-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: cd frontend && yarn install --frozen-lockfile
      - run: cd frontend && npx tsc --noEmit
